<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>買取再販 収支表</title>
<style>
:root{
  --navy:#1F3864; --navy2:#2C4A7C; --bg:#F2F4F8; --card:#FFFFFF; --line:#DDE2EA; --text:#1C2433; --muted:#667085;
  --in-bg:#FFFBEB; --in-line:#E8DCAE; --in-text:#1A4FB0; --calc:#F4F5F7;
  --a:#DDEBF7; --a2:#2F5597; --b:#E2EFDA; --b2:#548235; --neg:#C00000;
  --font:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- 上部バー ---------- */
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px 14px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;color:var(--navy);font-size:16px;white-space:nowrap;letter-spacing:.02em}
.prop{display:flex;gap:6px;align-items:center;flex:1 1 360px;min-width:0}
.prop select{flex:1 1 auto;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;background:#fff;color:var(--text)}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.saved.err{color:var(--neg)}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;height:34px;padding:0 12px;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#F6F7F9}
.btn:focus-visible{outline:2px solid var(--navy2);outline-offset:1px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy2)}
.btn.icon{padding:0 10px}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:40px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.12);padding:6px;min-width:210px;display:none;z-index:40}
.menu.open .menu-pop{display:block}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;font-size:13px}
.menu-pop button:hover{background:#F2F4F8}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* ---------- タブ（スマホ） ---------- */
.tabs{display:none;position:sticky;top:var(--topbar-h,56px);z-index:25;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;height:42px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}

/* ---------- 本体 ---------- */
main{display:grid;grid-template-columns:minmax(400px,470px) minmax(0,1fr);gap:16px;padding:16px;align-items:start;max-width:1560px;margin:0 auto}
.inputs{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px}
.card h2{margin:0 0 10px;font-size:13px;color:var(--navy);display:flex;align-items:center;gap:8px;font-weight:700}
.card h2::before{content:"";width:4px;height:14px;background:var(--navy);border-radius:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.span2{grid-column:1/-1}
.f>label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.dot.a{background:var(--a2)} .dot.b{background:var(--b2)}
.box{display:flex;align-items:center;background:var(--in-bg);border:1px solid var(--in-line);border-radius:8px;height:34px;padding:0 9px;gap:4px;min-width:0}
.box:focus-within{border-color:#C9A227;box-shadow:0 0 0 3px rgba(201,162,39,.18)}
.box input,.box select{border:0;background:transparent;outline:none;font:inherit;color:var(--in-text);width:100%;min-width:0;height:100%;padding:0}
.box select{cursor:pointer}
.box input.r{text-align:right;font-variant-numeric:tabular-nums}
.box input::placeholder{color:#8A94A6}
.box .u{font-size:12px;color:var(--muted);white-space:nowrap}
.box .tag{font-size:10.5px;color:#fff;background:#8A94A6;border-radius:4px;padding:1px 5px;white-space:nowrap}
.box.ym input{text-align:right;flex:1 1 0;width:auto;min-width:0}
.box.ym input.y{flex-grow:1.6}
.only-m{display:none}
.lands{display:flex;flex-direction:column;gap:8px}
.land-row{border:1px solid var(--line);border-radius:10px;padding:8px 10px 10px;background:#FCFCFD;display:flex;flex-direction:column;gap:6px}
.land-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--navy);font-weight:600;min-height:20px}
.land-g{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.box.frac input{flex:1 1 0;width:auto;min-width:0}
.land-del{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
.land-del:hover{background:#F2F4F8;color:var(--neg)}
.lands-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn.small{height:28px;font-size:12px;padding:0 10px}
@media (max-width:420px){ .land-g{grid-template-columns:1fr} }
.hint{font-size:11.5px;color:var(--muted);line-height:1.45}
.hint:empty{display:none}
.hint b{color:var(--text);font-weight:600}
.hint a{color:var(--navy2);cursor:pointer;text-decoration:underline}
.checkline{display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer;line-height:1.4}
.checkline input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--navy)}
.foot{margin-top:12px;background:var(--calc);border-radius:8px;padding:8px 10px;display:grid;gap:4px}
.foot .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.foot .row span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.taxt{width:100%;border-collapse:collapse;font-size:12.5px}
.taxt th,.taxt td{padding:4px 2px;text-align:right;font-variant-numeric:tabular-nums}
.taxt th:first-child,.taxt td:first-child{text-align:left;font-weight:400;color:var(--muted)}
.taxt thead th{font-size:11.5px;color:var(--muted);font-weight:600}
.taxt tr.total td{font-weight:700;color:var(--text);border-top:1px solid var(--line)}
.taxnote{font-size:11.5px;color:var(--muted);margin-top:6px}
.neg{color:var(--neg)}
.pane-foot{font-size:11.5px;color:var(--muted);padding:2px 4px 8px;line-height:1.6}

/* ---------- 収支表 ---------- */
.report-pane{min-width:0;position:sticky;top:calc(var(--topbar-h,56px) + 16px)}
.report-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.pane-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;font-size:12px;color:var(--muted)}
#report svg{width:100%;height:auto;display:block;margin:0 auto}
/* ---------- スマホ下部サマリー ---------- */
.sumbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);color:#fff;padding:9px 14px calc(9px + env(safe-area-inset-bottom));gap:10px;align-items:center;justify-content:space-between;font-size:12px}
.sumbar .lbl{opacity:.8}
.sumbar .v{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.sumbar .neg{color:#FFB4B4}
.sumbar button{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:7px;height:30px;padding:0 10px;font-size:12px}

/* ---------- モーダル・トースト ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(16,24,40,.3)}
.modal h3{margin:0;padding:16px 18px 10px;font-size:16px;color:var(--navy)}
.modal .mb{padding:0 18px 8px;overflow:auto;font-size:13.5px;line-height:1.6}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;flex-wrap:wrap}
.modal .sub{font-size:12.5px;font-weight:700;color:var(--navy);margin:14px 0 8px}
.modal .sub small{font-weight:400;color:var(--muted);margin-left:6px}
.btn.danger{background:#B42318;border-color:#B42318;color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1C2433;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:#FEF3F2;color:#B42318;border-bottom:1px solid #FECDCA;padding:8px 16px;font-size:12.5px;display:none}
.backup-banner{display:none;background:#FFF8E1;border-bottom:1px solid #F1D58A;color:#6B4E00;padding:8px 16px;font-size:13px;align-items:center;gap:8px 12px;flex-wrap:wrap;line-height:1.5}
.backup-banner.show{display:flex}
.bb-actions{display:flex;gap:6px;margin-left:auto}

@media (max-width:999px){
  main{grid-template-columns:1fr;padding:12px 12px 80px}
  .tabs{display:flex}
  body[data-tab="input"] .report-pane{display:none}
  body[data-tab="report"] .inputs{display:none}
  body[data-tab="input"] .sumbar{display:flex}
  .report-pane{position:static}
  .report-card{padding:8px}
  .box{height:40px}
  .box input,.box select{font-size:16px}
  .topbar{padding:8px 12px;gap:8px}
  .brand,.saved,#btnPrint{display:none}
  .prop,.actions{flex:1 1 100%}
  .actions{flex-wrap:nowrap}
  .actions>.btn{flex:1 1 0;justify-content:center;padding:0 8px}
  .only-m{display:inline}
  body[data-tab="report"] main{padding:4px 4px 16px}
  .report-card{padding:0;border:0;border-radius:0;background:transparent}
  .pane-head{display:none}
}
@media (max-width:420px){ .grid{gap:10px 8px} .card{padding:12px 11px 13px} }
/* PC：左（入力）と右（収支表）を別々にスクロール */
@media screen and (min-width:1000px){
  body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .topbar,.banner,.backup-banner{flex:none}
  .topbar{position:static}
  main{flex:1 1 auto;min-height:0;width:100%;padding:0 16px;align-items:stretch;grid-template-rows:minmax(0,1fr)}
  .inputs,.report-pane{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 4px 24px}
  .report-pane{position:static}
}
/* PC：上のバーとメニューの文字を気持ち大きく（入力欄は元の大きさ） */
@media screen and (min-width:1000px){
  .topbar{font-size:15px}
  .brand{font-size:17px}
  .saved{font-size:13px}
  .topbar .btn{font-size:14px;height:36px}
  .prop select{height:36px}
  .menu-pop{top:42px}
  .menu-pop button{font-size:14px}
  .pane-head{font-size:13px}
  #toast,.backup-banner{font-size:14px}
  .banner{font-size:13.5px}
}
@media print{
  @page{size:A4 portrait;margin:8mm}
  html,body{background:#fff}
  .topbar,.tabs,.inputs,.sumbar,.pane-head,#toast,.banner,.modal-bg{display:none!important}
  main{display:block;padding:0;max-width:none}
  .report-pane{display:block!important;position:static}
  .report-card{border:0;padding:0;border-radius:0}
  #report svg{width:min(100%, calc(270mm * var(--ar, 0.58)));max-width:none;height:auto;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body data-tab="input">

<header class="topbar" id="topbar">
  <div class="brand">買取再販 収支表</div>
  <div class="prop">
    <select id="propSelect" aria-label="物件を選ぶ"></select>
    <button class="btn" id="btnNew" title="新しい物件を作る">＋新規</button>
    <span class="saved" id="savedState"></span>
  </div>
  <div class="actions">
    <button class="btn primary" id="btnCopy">画像をコピー</button>
    <button class="btn" id="btnSave"><span id="saveLabel">画像を保存</span></button>
    <button class="btn" id="btnPrint">印刷</button>
    <div class="menu" id="menu">
      <button class="btn icon" id="btnMenu" aria-haspopup="true" aria-expanded="false">メニュー ▾</button>
      <div class="menu-pop" role="menu">
        <button data-act="dup">この物件を複製</button>
        <button data-act="del">この物件を削除</button>
        <hr>
        <button data-act="export" id="menuBackup">バックアップを保存</button>
        <button data-act="import">バックアップから戻す</button>
        <hr>
        <button data-act="settings">初期値・計算ルールの設定</button>
      </div>
    </div>
  </div>
</header>
<div class="banner" id="banner">このブラウザでは自動保存ができません。入力内容は「メニュー → バックアップを保存」で保存してください。</div>
<div class="backup-banner" id="backupBanner" role="status">
  <span id="backupMsg"></span>
  <span class="bb-actions"><button class="btn small primary" id="bbSave">バックアップを保存</button><button class="btn small" id="bbLater">あとで</button></span>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="input" class="on">入力</button>
  <button data-tab="report">収支表</button>
</nav>

<main>
  <section class="inputs" id="inputs"></section>
  <section class="report-pane">
    <div class="report-card">
      <div class="pane-head"><span>印刷はこの表のまま出ます。画像（コピー・保存）は、スマホでも読みやすい縦長の表で、消費税の内訳は入りません</span><span id="reportDate"></span></div>
      <div id="report"></div>
    </div>
  </section>
</main>

<div class="sumbar" id="sumbar">
  <div><div class="lbl">ＰＪ経常利益 他社付け</div><div class="v" id="sumA"></div></div>
  <div><div class="lbl">自社付け</div><div class="v" id="sumB"></div></div>
  <button data-goto="report">収支表を見る</button>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* =========================================================
   設定・定数
   ========================================================= */
const KEY_DB = 'kaitori-shushi:v1:db';
const KEY_SET = 'kaitori-shushi:v1:settings';
const SVG_FONT = "'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif";
const C = { navy:'#1F3864', line:'#C9CED6', label:'#EEF2F7', a:'#DDEBF7', b:'#E2EFDA', sub:'#EDEDED',
            cost:'#D9E1F2', profit:'#FFE699', profit2:'#FFD966', kubun:'#F7F7F7', neg:'#C00000', muted:'#595959', text:'#111111' };

const DEFAULT_SETTINGS = {
  defaults: { months:10, regBuy:600000, bkFlag:'あり', rate:2.5, loanFee:800000, util:5000,
              inshi:360000, ad:28800, hoken:57490, regSell:22000,
              kyakuRate:3, incRate:0.3, sincRate:10, roumu:200000, taxRate:10, tmpRate:3 },
  rules:    { bkRate:3, bkAdd:60000, loanRatio:100, yobiRate:2 },
  display:  { taxDetail:true }
};

// 今お使いのExcel（サンプルシート）と同じ数値
const SAMPLE = { name:'サンプル物件', address:'', area:77.28, layout:'2SLDK', builtY:2006, builtM:10, direction:'北西角',
  floor:2, floors:20, units:868, buy:45000000, months:10, sellA:67800000, sellB:69800000,
  regBuy:600000, reno:9000000, bkFlag:'あり', loan:null, rate:2.5, loanFee:800000, yobi:null,
  kanri:12500, shuzen:19620, other:1750, util:5000, kotei:150000,
  inshi:360000, ad:28800, hoken:57490, regSell:22000, kyakuRate:3, incRate:0.3,
  rent:0, rentM:0, genka:0, ippan:0, roumu:200000, sincRate:10,
  lands:[{eval:null, den:null, num:null}], bldgEval:null, taxRate:10, tmpRate:3, buyTaxIn:null, rentedBuy:false };

/* =========================================================
   小さな道具
   ========================================================= */
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kd of kids){ if (kd != null) e.append(kd.nodeType ? kd : document.createTextNode(kd)); }
  return e;
}
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const isNum = x => typeof x === 'number' && isFinite(x);
const n0 = x => isNum(x) ? x : 0;
// Excel の ROUND と同じ（0.5 は 0 から遠い方へ）
const xround = x => { const s = Math.sign(x); return s * Math.round(Math.abs(x) + 1e-9); };
const xfloor = x => Math.floor(x + 1e-7);
function parseNum(s){
  if (s == null) return null;
  s = String(s).replace(/[０-９．－ー]/g, ch => ch === '．' ? '.' : (ch === '－' || ch === 'ー') ? '-' : String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
               .replace(/[,，\s円%％]/g, '');
  if (s === '' || s === '-') return null;
  const v = Number(s);
  return isFinite(v) ? v : null;
}
const yen = v => isNum(v) ? Math.round(v).toLocaleString('ja-JP') : '';
function amt(v){ if (!isNum(v) || Math.round(v) === 0) return {s:'-', neg:false};
  return {s:(v < 0 ? '▲' : '') + Math.abs(Math.round(v)).toLocaleString('ja-JP'), neg:v < 0}; }
function pct(v){ if (!isNum(v) || v === 0) return {s:'-', neg:false};
  return {s:(v < 0 ? '▲' : '') + (Math.abs(v) * 100).toFixed(1) + '%', neg:v < 0}; }
const fmtRate = r => (isNum(r) ? (Math.round(r * 1000) / 1000) : 0) + '%';
function today(){ const d = new Date(); return {y:d.getFullYear(), m:d.getMonth() + 1, d:d.getDate()}; }
const ymd = (sep='') => { const t = today(); return t.y + sep + String(t.m).padStart(2,'0') + sep + String(t.d).padStart(2,'0'); };
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));

/* =========================================================
   保存（ブラウザ内）
   ========================================================= */
const store = {
  ok: true,
  get(k){ try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch(e){ this.ok = false; return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ this.ok = false; return false; } }
};
function mergeSettings(saved){
  const s = clone(DEFAULT_SETTINGS);
  if (saved && typeof saved === 'object'){
    for (const g of ['defaults','rules','display']) if (saved[g]) Object.assign(s[g], saved[g]);
  }
  return s;
}
let settings = mergeSettings(store.get(KEY_SET));
let db = store.get(KEY_DB);
if (!db || !db.items || !Array.isArray(db.order) || !db.order.length){
  const p = makeProp(clone(SAMPLE));
  p.autoSample = true;   // 自動で作った見本（バックアップから戻すときに片付ける）
  db = { current:p.id, order:[p.id], items:{[p.id]:p} };
  persist();
}
if (!db.items[db.current]) db.current = db.order[0];
for (const id of db.order){ const p = db.items[id]; if (p) p.v = normalizeV(Object.assign(blankValues(), p.v)); }

// バックアップの記録：最後に保存した日時・最後に入力を変えた日時など
const KEY_META = 'kaitori-shushi:v1:meta';
const DAY = 24 * 60 * 60 * 1000, WEEK = 7 * DAY;
let meta = Object.assign({firstUseAt:Date.now(), lastBackupAt:null, changedAt:null, snoozeUntil:0}, store.get(KEY_META) || {});
store.set(KEY_META, meta);
const saveMeta = () => store.set(KEY_META, meta);
const md = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
function markChanged(){ meta.changedAt = Date.now(); saveMeta(); checkBackup(); }
// 前回のバックアップ（まだなら使い始め）から1週間たち、その間に入力の変更があればお知らせ
function checkBackup(){
  const now = Date.now(), base = meta.lastBackupAt || meta.firstUseAt;
  const due = !!meta.changedAt && meta.changedAt > (meta.lastBackupAt || 0) && now - base >= WEEK && now >= (meta.snoozeUntil || 0);
  const b = $('#backupBanner');
  if (b){
    $('#backupMsg').textContent = meta.lastBackupAt
      ? `前回のバックアップ（${md(meta.lastBackupAt)}）から1週間以上たっています。ブラウザのデータが消えたときに備えて、バックアップを保存しましょう。`
      : 'まだバックアップを保存していません。ブラウザのデータが消えたときに備えて、バックアップを保存しましょう。';

// 古い形式（土地の評価額を一室分で直接入れていた）のデータを、1分の1の筆として引き継ぐ
function normalizeV(v){

  const empty = v.lands.every(x => !isNum(x.eval) && !isNum(x.den) && !isNum(x.num));

/* =========================================================
   計算（Excel と同じ式。消費税だけ「売却時−仕入時」）
   ========================================================= */
function compute(v, rules){
  const months = n0(v.months), buy = n0(v.buy), t = n0(v.taxRate) / 100;
  const r = {};
  r.tsubo = isNum(v.area) && v.area > 0 ? v.area * 0.3025 : null;
  if (isNum(v.builtY) && v.builtY > 1800){
    const td = today(), bm = isNum(v.builtM) ? v.builtM : 1;
    r.age = td.y - v.builtY - (td.m < bm ? 1 : 0);
  } else r.age = null;
  r.bkFee = v.bkFlag === 'あり' ? xround((buy * n0(rules.bkRate) / 100 + n0(rules.bkAdd)) * (1 + t)) : 0;
  r.loanAuto = xround(buy * n0(rules.loanRatio) / 100);
  r.loan = isNum(v.loan) ? v.loan : r.loanAuto;
  r.loanFee = n0(v.loanFee);
  r.yobiAuto = xround(r.loanFee * n0(rules.yobiRate) / 100);
  r.yobi = isNum(v.yobi) ? v.yobi : r.yobiAuto;
  r.interest = xround(r.loan * n0(v.rate) / 100 * months / 12);
  r.util = xround(n0(v.util) * months);
  r.kanri = xround((n0(v.kanri) + n0(v.shuzen) + n0(v.other)) * months);
  r.kotei = xround(n0(v.kotei) * months / 12);
  r.rentInc = xround(n0(v.rent) * n0(v.rentM));
  r.roumu = xround(n0(v.roumu) * months);

  // 消費税：固定資産税評価額で按分（評価額が未入力なら暫定税率）
  // 土地：筆ごとに「土地全体の評価額×敷地権割合」（円未満切り捨て）を出して合計
  r.lands = (Array.isArray(v.lands) ? v.lands : []).map(x => {
    const has = isNum(x.eval) || isNum(x.den) || isNum(x.num);
    const ok = isNum(x.eval) && x.eval > 0 && isNum(x.den) && x.den > 0 && isNum(x.num) && x.num > 0 && x.num <= x.den;
    return { has, ok, part: ok ? xfloor(x.eval * x.num / x.den) : null };
  });
  r.landIncomplete = r.lands.some(x => x.has && !x.ok);
  r.landEval = r.lands.reduce((s, x) => s + (x.ok ? x.part : 0), 0);
  const L = r.landEval, B = n0(v.bldgEval);
  r.taxOk = L > 0 && B > 0 && !r.landIncomplete;
  r.landShare = r.taxOk ? L / (L + B) : null;
  const div = r.taxOk ? L / B + 1 + t : null;
  const taxIn = P => P <= 0 ? 0 : r.taxOk ? xfloor(P / div * t) : xfloor(P * n0(v.tmpRate) / 100);
  r.buyTaxAuto = taxIn(buy);
  r.buyTaxManual = isNum(v.buyTaxIn);
  // 賃貸中で仕入れた場合は差し引けないので常に0。手入力があればその額、なければ按分（または暫定税率）
  r.buyTax = v.rentedBuy ? 0 : (r.buyTaxManual ? v.buyTaxIn : r.buyTaxAuto);

  const common = { buy, regBuy:n0(v.regBuy), reno:n0(v.reno), inshi:n0(v.inshi), ad:n0(v.ad),
                   hoken:n0(v.hoken), regSell:n0(v.regSell), genka:n0(v.genka), ippan:n0(v.ippan) };
  for (const key of ['A','B']){
    const P = n0(key === 'A' ? v.sellA : v.sellB);
    const o = Object.assign({}, common);
    o.sales = P; o.rentInc = r.rentInc;
    o.saleTax = taxIn(P);
    o.tax = o.saleTax - r.buyTax;
    o.rev = P + r.rentInc;
    o.bkFee = r.bkFee;
    o.sub1 = buy + o.regBuy + r.bkFee + o.reno;
    o.loanFee = r.loanFee; o.yobi = r.yobi; o.util = r.util; o.kanri = r.kanri; o.kotei = r.kotei;
    o.sub2 = r.loanFee + r.yobi + r.util + r.kanri + r.kotei;
    o.cost = o.sub1 + o.sub2;
    o.kyaku = key === 'A' ? xround((P - o.saleTax) * n0(v.kyakuRate) / 100) : 0;
    o.inc   = key === 'B' ? xround((P - o.saleTax) * n0(v.incRate) / 100) : 0;
    o.sub3 = o.inshi + o.ad + o.hoken + o.regSell + o.kyaku + o.inc;
    o.gross = o.rev - o.cost - o.genka - o.sub3;
    o.interest = r.interest;
    o.op = o.gross - r.interest - o.tax;
    o.roumu = r.roumu;
    o.ord = o.op - r.roumu - o.ippan;
    o.sinc = Math.max(0, xround(o.ord * n0(v.sincRate) / 100));
    o.pj = o.ord - o.sinc;
    o.ratio = k => o.rev ? o[k] / o.rev : 0;
    r[key] = o;
  }
  return r;
}

const fieldObjs = [];
const footEls = [];
function makeField(f, ctx){
  const id = ctx.prefix + f.k;
  const wrap = el('div', {class:'f' + (f.span ? ' span2' : '')});
  if (f.type === 'lands'){
    const list = el('div', {class:'lands'});
    const total = el('div', {class:'hint'});
    const addBtn = el('button', {type:'button', class:'btn small', text:'＋筆を追加'});
    wrap.append(el('label', {text:f.label}), list, el('div', {class:'lands-foot'}, addBtn, total));
    if (f.note) wrap.append(el('div', {class:'hint', text:f.note}));
    const rows = () => { let a = ctx.get(f.k); if (!Array.isArray(a) || !a.length){ a = [emptyLand()]; ctx.set(f.k, a); } return a; };
    const rowEls = [];
    const build = () => {
      list.textContent = ''; rowEls.length = 0;
      const arr = rows();
      arr.forEach((x, i) => {
        const inp = (key, ph, label) => {
          const e = el('input', {id:`${ctx.prefix}land-${i}-${key}`, type:'text', inputmode:'numeric', autocomplete:'off', class:'r', placeholder:ph, 'aria-label':label});
          const show = () => { e.value = x[key] == null ? '' : (key === 'eval' ? yen(x[key]) : String(x[key])); };
          e.addEventListener('blur', show);
          e.addEventListener('input', () => { x[key] = parseNum(e.value); ctx.changed(); });
          show();
          return e;
        };
        const ev = inp('eval', '', '土地全体の評価額');
        const den = inp('den', '分母', '敷地権割合の分母');
        const num = inp('num', '分子', '敷地権割合の分子');
        const part = el('div', {class:'hint'});
        const head = el('div', {class:'land-h'}, el('span', {text: arr.length > 1 ? `${i + 1}筆目` : '敷地（一筆）'}));
        if (arr.length > 1) head.append(el('button', {type:'button', class:'land-del', title:'この筆を削除', 'aria-label':`${i + 1}筆目を削除`, text:'×',
          onclick:() => { rows().splice(i, 1); build(); ctx.changed(); }}));
        list.append(el('div', {class:'land-row'}, head,
          el('div', {class:'land-g'},
            el('div', {class:'f'}, el('label', {for:ev.id, text:'土地全体の評価額'}), el('div', {class:'box'}, ev, el('span', {class:'u', text:'円'}))),
            el('div', {class:'f'}, el('label', {for:den.id, text:'敷地権割合'}), el('div', {class:'box frac'}, den, el('span', {class:'u', text:'分の'}), num))),
          part));
        rowEls.push({part});
      });
    };
    addBtn.addEventListener('click', () => {
      rows().push(emptyLand()); build(); ctx.changed();
      const e = document.getElementById(`${ctx.prefix}land-${rows().length - 1}-eval`); e && e.focus();
    });
    return { wrap, load:build, update(v, c){
      rowEls.forEach((r, i) => { const L = c.lands && c.lands[i];
        r.part.innerHTML = !L || !L.has ? '' : L.ok ? `一室分 <b>${yen(L.part)}</b>円`
          : '<span class="neg">評価額・分母・分子をすべて入れてください（分子は分母以下）</span>'; });
      total.innerHTML = rows().length > 1 ? `土地（一室分）の合計 <b>${yen(c.landEval)}</b>円` : '';
    }};
  }
  if (f.type === 'check'){
    const cb = el('input', {type:'checkbox', id});
    cb.addEventListener('change', () => { ctx.set(f.k, cb.checked); ctx.changed(); });
    wrap.append(el('label', {class:'checkline', for:id}, cb, el('span', {text:f.label})));
    if (f.note) wrap.append(el('div', {class:'hint', text:f.note}));
    return { wrap, load(){ cb.checked = !!ctx.get(f.k); }, update(){} };
  }
  const lab = el('label', {for:id}, f.label);
  if (f.tone) lab.prepend(el('i', {class:'dot ' + f.tone}));
  const box = el('div', {class:'box'});
  const hint = el('div', {class:'hint'});
  wrap.append(lab, box, hint);

  if (f.type === 'select'){
    const s = el('select', {id});
    f.options.forEach(o => s.append(el('option', {value:o, text:o})));
    s.addEventListener('change', () => { ctx.set(f.k, s.value); ctx.changed(); });
    box.append(s);
    return { wrap, load(){ s.value = ctx.get(f.k) || f.options[0]; }, update(v, c){ setHint(hint, f, v, c); } };
  }
  if (f.type === 'ym'){
    box.classList.add('ym');
    const y = el('input', {id, class:'y', type:'text', inputmode:'numeric', placeholder:'2006', autocomplete:'off', 'aria-label':'築年'});
    const m = el('input', {class:'m', type:'text', inputmode:'numeric', placeholder:'10', autocomplete:'off', 'aria-label':'築月'});
    y.addEventListener('input', () => { ctx.set('builtY', parseNum(y.value)); ctx.changed(); });
    m.addEventListener('input', () => { ctx.set('builtM', parseNum(m.value)); ctx.changed(); });
    box.append(y, el('span', {class:'u', text:'年'}), m, el('span', {class:'u', text:'月'}));
    return { wrap, load(){ y.value = ctx.get('builtY') ?? ''; m.value = ctx.get('builtM') ?? ''; }, update(v, c){ setHint(hint, f, v, c); } };
  }
  const numeric = f.type !== 'text';
  const inp = el('input', {id, type:'text', autocomplete:'off',
    inputmode: f.type === 'int' || f.type === 'yen' ? 'numeric' : (numeric ? 'decimal' : null), class: numeric ? 'r' : null});
  box.append(inp);
  const unit = f.unit || (f.type === 'yen' ? '円' : f.type === 'pct' ? '%' : '');
  let tag = null;
  if (f.auto){ tag = el('span', {class:'tag', text:'自動'}); box.append(tag); }
  if (unit) box.append(el('span', {class:'u', text:unit}));
  const show = () => {
    const val = ctx.get(f.k);
    if (!numeric) inp.value = val ?? '';
    else if (val == null) inp.value = '';
    else inp.value = f.type === 'yen' ? yen(val) : String(val);
    if (tag) tag.style.display = val == null ? '' : 'none';
  };
  inp.addEventListener('blur', show);
  inp.addEventListener('input', () => {
    ctx.set(f.k, numeric ? parseNum(inp.value) : inp.value);
    if (tag) tag.style.display = ctx.get(f.k) == null ? '' : 'none';
    ctx.changed();
  });
  return { wrap, load:show, update(v, c){
    if (f.auto){
      const a = f.auto(c);
      inp.placeholder = yen(a);
      if (ctx.get(f.k) == null) hint.innerHTML = `自動：${esc(f.autoNote(c))}`;
      else { hint.innerHTML = `手入力中（自動なら ${yen(a)}円）　<a role="button">自動に戻す</a>`;
             hint.querySelector('a').onclick = () => { ctx.set(f.k, null); show(); ctx.changed(); }; }
    } else setHint(hint, f, v, c);
  }};
}
function setHint(hint, f, v, c){
  const parts = [];
  if (f.hint){ const h = f.hint(v, c); if (h) parts.push(h); }
  if (f.note) parts.push(esc(f.note));
  hint.innerHTML = parts.join('　');
}

function renderFoots(v, c){

        : `評価額が未入力のため、暫定税率（価格×${fmtRate(v.tmpRate)}）で計算しています`;
      ft.innerHTML = `<div class="taxnote" style="margin:0 0 4px">${status}</div>
        <table class="taxt"><thead><tr><th></th><th>他社付け</th><th>自社付け</th></tr></thead><tbody>
        ${row('売却時の消費税', c.A.saleTax, c.B.saleTax)}
        ${row('仕入時の消費税' + (v.rentedBuy ? '（賃貸中のため0）' : c.buyTaxManual ? '（手入力）' : ''), c.buyTax, c.buyTax)}
        ${row('収支表の消費税（差額）', c.A.tax, c.B.tax, 'total')}
        </tbody></table>
        <div class="taxnote">評価額は「課税標準額」ではなく「価格（評価額）」の欄の金額を入れてください。消費税は1円未満切り捨てです。</div>`;
    } else {
      ft.innerHTML = sec.foot(v, c).map(([l, x]) => { const f = amt(x);
          return `<div class="row"><span>${esc(l)}</span><span class="${f.neg ? 'neg' : ''}">${f.s === '-' ? '0' : f.s}円</span></div>`; }).join('')
        + (sec.footNote ? `<div class="taxnote" style="margin:0">${esc(sec.footNote)}</div>` : '');
    }
  }
}

const mctx = document.createElement('canvas').getContext('2d');
function fit(s, maxW, size, weight){
  s = String(s ?? '');
  mctx.font = `${weight} ${size}px ${SVG_FONT}`;
  if (mctx.measureText(s).width <= maxW) return s;
  while (s.length && mctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}
// 端末によってフォントの数字の幅が違う（Macのヒラギノは広い）。設計に使ったフォントの幅を基準に、
// それより広いフォントの端末では、スマホの表と画像の文字をそのぶん小さくして、文字と枠の比率をそろえる
const DIGIT_REF = {400:7.027, 700:7.513};     // 「0123456789,.%」の幅（文字サイズ1あたり）
let fontK = 1;
function calcFontK(){
  const m = w => { mctx.font = `${w} 100px ${SVG_FONT}`; return mctx.measureText('0123456789,.%').width / 100; };
  const r = Math.max(m(400) / DIGIT_REF[400], m(700) / DIGIT_REF[700]);
  fontK = r > 1.01 ? 1 / r : 1;
}
// 枠の幅に収まるように：まず最大2割まで文字を小さくし、それでも入らないときだけ「…」
function fitText(s, maxW, size, weight){
  s = String(s ?? '');
  mctx.font = `${weight} ${size}px ${SVG_FONT}`;
  const w = mctx.measureText(s).width;
  if (w <= maxW) return {s, size};
  const ns = Math.floor(size * maxW / w * 10) / 10;
  if (ns >= size * 0.8) return {s, size:ns};
  return {s:fit(s, maxW, size * 0.8, weight), size:size * 0.8};
}

function buildSVGCompact(v, c, opt = {}){
  // スマホ用：余白を最小限にし、列幅を数字が収まるぎりぎりまで詰めた表（横544）。画面の横幅いっぱいに表示
  const W = 544, X = 1, IW = W - X * 2;
  const o = [];
  let y = 1;
  const rect = (x, yy, w, h, fill, stroke = C.line) =>
    o.push(`<rect x="${x}" y="${yy}" width="${w}" height="${h}" fill="${fill || '#fff'}"${stroke ? ` stroke="${stroke}" stroke-width="1"` : ''}/>`);
  const text = (x, cy, s, {size = 15, weight = 400, anchor = 'start', fill = C.text, fitW = 0} = {}) => {
    size = size * fontK;
    if (fitW){ const r = fitText(s, fitW, size, weight); s = r.s; size = r.size; }
    o.push(`<text x="${x}" y="${(cy + size * 0.36).toFixed(1)}" font-size="${+size.toFixed(2)}" font-weight="${weight}" text-anchor="${anchor}" fill="${fill}">${esc(s)}</text>`);
  };
  const num = (x, cy, val, opt = {}) => { const f = opt.pct ? pct(val) : amt(val);
    text(x, cy, f.s, Object.assign({anchor:'end'}, opt, {fill: f.neg ? C.neg : (opt.fill || C.text)})); };

  // タイトル
  rect(X, y, IW, 34, C.navy, null);
  const t = today();
  text(W - X - 9, y + 17, `作成日 ${t.y}/${t.m}/${t.d}`, {size:11.5, anchor:'end', fill:'#DCE3F0'});
  text(X + 9, y + 17, '収支表｜' + (v.name || '（物件名未入力）'), {size:17, weight:700, fill:'#fff', fitW:IW - 125});
  y += 34 + 5;

  // 物件概要（左右2列 × 4行）
  const tsubo = c.tsubo;
  const buyStr = isNum(v.buy) && v.buy > 0 ? `${yen(v.buy)}円` + (tsubo ? `（坪${Math.round(v.buy / tsubo / 10000).toLocaleString('ja-JP')}万円）` : '') : '';
  const areaStr = [v.layout || '', isNum(v.area) ? `${v.area.toFixed(2)}㎡` + (tsubo ? `（${tsubo.toFixed(2)}坪）` : '') : ''].filter(Boolean).join('／');
  const builtStr = isNum(v.builtY) ? `${v.builtY}年` + (isNum(v.builtM) ? `${v.builtM}月` : '') + (c.age != null ? `（築${c.age}年）` : '') : '';
  const floorStr = (isNum(v.floor) ? `${v.floor}階` : '') + (isNum(v.floors) ? `／${v.floors}階建` : '');
  const pairs = [
    [['物件名', v.name], ['所在', v.address]],
    [['仕入価格', buyStr], ['間取り', areaStr]],
    [['築年月', builtStr], ['所在階', floorStr]],
    [['方角', v.direction], ['総戸数', isNum(v.units) ? `${v.units}戸` : '']],
  ];
  const half = IW / 2, LW = 58, VW = half - LW, PH = 24;
  for (const row of pairs){
    row.forEach(([lab, val], i) => {
      const x = X + i * half;
      rect(x, y, LW, PH, C.label); text(x + 5, y + PH / 2, lab, {size:11.5, fill:C.muted});
      rect(x + LW, y, VW, PH, '#fff'); text(x + LW + 5, y + PH / 2, val || '', {size:14, weight:700, fitW:VW - 9});
    });
    y += PH;
  }
  y += 5;

  // 収支明細
  const dw = [48, 160, 111, 56, 111, 56];
  const dx = [X]; for (let i = 0; i < dw.length - 1; i++) dx.push(dx[i] + dw[i]);
  const HH = 26, RH = 23;
  rect(dx[0], y, dw[0], HH, C.navy); text(dx[0] + dw[0] / 2, y + HH / 2, '区分', {size:13, weight:700, anchor:'middle', fill:'#fff'});
  rect(dx[1], y, dw[1], HH, C.navy); text(dx[1] + dw[1] / 2, y + HH / 2, '項目', {size:13, weight:700, anchor:'middle', fill:'#fff'});
  rect(dx[2], y, dw[2] + dw[3], HH, C.a);
  text(dx[2] + (dw[2] + dw[3]) / 2, y + HH / 2, `他社付け（手数料${fmtRate(v.kyakuRate)}）`, {size:13, weight:700, anchor:'middle', fitW:dw[2] + dw[3] - 6});
  rect(dx[4], y, dw[4] + dw[5], HH, C.b); text(dx[4] + (dw[4] + dw[5]) / 2, y + HH / 2, '自社付け（手数料無料）', {size:13, weight:700, anchor:'middle'});
  y += HH;
  const top = y;
  const STY = { sub:[C.sub, 700, 15], cost:[C.cost, 700, 15], profit:[C.profit, 700, 16], profit2:[C.profit2, 700, 16.5], single:['#fff', 400, 15] };
  const groups = [];
  REPORT_ROWS.forEach((row, i) => {
    const yy = top + i * RH, cy = yy + RH / 2;
    const [fill, weight, size] = STY[row.st] || ['#fff', 400, 15];
    if (row.g){
      const last = groups[groups.length - 1];
      if (last && last.g === row.g) last.n++; else groups.push({g:row.g, y:yy, n:1});
      rect(dx[1], yy, dw[1], RH, fill);
      if (row.st === 'sub') text(dx[1] + dw[1] / 2, cy, row.label, {size, weight, anchor:'middle'});
      else text(dx[1] + 5, cy, row.label, {size, weight, fitW:dw[1] - 8});
    } else {
      rect(dx[0], yy, dw[0] + dw[1], RH, fill);
      text(dx[0] + (dw[0] + dw[1]) / 2, cy, row.label, {size, weight, anchor:'middle'});
    }
    const ps = size > 15 ? 13.5 : 12.5;
    for (const [k, ci] of [['A', 2], ['B', 4]]){
      const d = c[k];
      const active = row.only === k;
      const cf = active ? (k === 'A' ? C.a : C.b) : fill;
      rect(dx[ci], yy, dw[ci], RH, cf); rect(dx[ci + 1], yy, dw[ci + 1], RH, cf);
      if (row.only && !active){ text(dx[ci] + dw[ci] - 6, cy, '-', {size, anchor:'end'}); text(dx[ci + 1] + dw[ci + 1] - 4, cy, '-', {size:ps, anchor:'end'}); continue; }
      num(dx[ci] + dw[ci] - 6, cy, d[row.key], {size, weight});
      if (row.sales){
        const ts = (d.sales > 0 && c.tsubo) ? `坪${Math.round(d.sales / c.tsubo / 10000).toLocaleString('ja-JP')}万` : '-';
        text(dx[ci + 1] + dw[ci + 1] - 4, cy, ts, {size:11.5, anchor:'end', fill:C.muted});
      } else num(dx[ci + 1] + dw[ci + 1] - 4, cy, d.ratio(row.key), {size:ps, weight, pct:true});
    }
  });
  const GROUP_LINES = {'仕入・リノベ':['仕入・','リノベ'], '融資・保有':['融資・','保有'], '販売費用':['販売','費用']};
  for (const gr of groups){
    rect(dx[0], gr.y, dw[0], gr.n * RH, C.kubun);
    const lines = GROUP_LINES[gr.g] || [gr.g], mid = gr.y + gr.n * RH / 2;
    lines.forEach((ln, j) => text(dx[0] + dw[0] / 2, mid + (j - (lines.length - 1) / 2) * 15 * fontK, ln, {size:13, weight:700, anchor:'middle'}));
  }
  y = top + REPORT_ROWS.length * RH + 5;

  // 消費税の内訳
  if (opt.taxDetail ?? settings.display.taxDetail){
    rect(X, y, IW, 22, C.cost);
    text(X + 6, y + 11, '消費税の内訳（収支表の消費税＝売却時−仕入時）', {size:12.5, weight:700, fill:C.navy, fitW:IW - 12});
    y += 22;
    const lw = dw[0] + dw[1];
    const status = c.taxOk
      ? `評価額で按分　土地 ${(c.landShare * 100).toFixed(1)}%：建物 ${((1 - c.landShare) * 100).toFixed(1)}%（土地 ${yen(c.landEval)}円／建物 ${yen(v.bldgEval)}円）`
      : `評価額が${c.landIncomplete ? '入力途中' : '未入力'}のため、暫定税率（価格×${fmtRate(v.tmpRate)}）で計算`;
    rect(X, y, IW, 20, '#fff'); text(X + 6, y + 10, status, {size:11.5, fill:C.muted, fitW:IW - 12});
    y += 20;
    const trow = (label, a, b, bold) => {
      const w = bold ? 700 : 400, f = bold ? C.sub : '#fff';
      rect(X, y, lw, RH, f); text(X + 6, y + RH / 2, label, {size:13.5, weight:w, fitW:lw - 10});
      rect(dx[2], y, dw[2] + dw[3], RH, f); num(dx[2] + dw[2] - 6, y + RH / 2, a, {size:15, weight:w});
      rect(dx[4], y, dw[4] + dw[5], RH, f); num(dx[4] + dw[4] - 6, y + RH / 2, b, {size:15, weight:w});
      y += RH;
    };
    trow('売却時の消費税', c.A.saleTax, c.B.saleTax);
    trow(v.rentedBuy ? '仕入時の消費税（賃貸中は0）' : c.buyTaxManual ? '仕入時の消費税（契約書）' : '仕入時の消費税', c.buyTax, c.buyTax);
    trow('差額（収支表の消費税）', c.A.tax, c.B.tax, true);
  }
  y += 1;
  const H = Math.ceil(y);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${SVG_FONT}" shape-rendering="crispEdges" text-rendering="geometricPrecision"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>${o.join('')}</svg>`;
  return {svg, W, H};
}

      } else num(dx[ci + 1] + dw[ci + 1] - 10, cy, d.ratio(row.key), {size: size > 13.5 ? 13.5 : 12.5, weight, pct:true});
    }
  });
  for (const gr of groups){
    rect(dx[0], gr.y, dw[0], gr.n * RH, C.kubun);
    text(dx[0] + dw[0] / 2, gr.y + gr.n * RH / 2, gr.g, {size:13.5, weight:700, anchor:'middle'});
  }
  y = top + REPORT_ROWS.length * RH + 14;

  // 消費税の内訳
  if (settings.display.taxDetail){
    rect(X, y, IW, 24, C.cost); text(X + 10, y + 12, '消費税の内訳（収支表の消費税＝売却時の消費税−仕入時の消費税）', {size:13, weight:700, fill:C.navy});
    y += 24;
    const lw = dw[0] + dw[1];
    const status = c.taxOk
      ? `固定資産税評価額で按分　土地 ${(c.landShare * 100).toFixed(1)}%：建物 ${((1 - c.landShare) * 100).toFixed(1)}%（一室分　土地 ${yen(c.landEval)}円／建物 ${yen(v.bldgEval)}円）`
      : `評価額が${c.landIncomplete ? '入力途中' : '未入力'}のため、暫定税率（価格×${fmtRate(v.tmpRate)}）で計算`;
    rect(X, y, IW, 22, '#fff'); text(X + 10, y + 11, fit(status, IW - 20, 12, 400), {size:12.5, fill:C.muted});
    y += 22;
    const trow = (label, a, b, bold) => {
      const w = bold ? 700 : 400;
      rect(X, y, lw, 22, bold ? C.sub : '#fff'); text(X + 10, y + 11, label, {size:13, weight:w});
      rect(dx[2], y, dw[2] + dw[3], 22, bold ? C.sub : '#fff'); num(dx[2] + dw[2] - 12, y + 11, a, {size:13, weight:w});
      rect(dx[4], y, dw[4] + dw[5], 22, bold ? C.sub : '#fff'); num(dx[4] + dw[4] - 12, y + 11, b, {size:13, weight:w});
      y += 22;
    };
    trow('売却時の消費税（販売価格に含まれる額）', c.A.saleTax, c.B.saleTax);
    trow(v.rentedBuy ? '仕入時の消費税（賃貸中のため0）' : c.buyTaxManual ? '仕入時の消費税（契約書の金額）' : '仕入時の消費税（仕入価格に含まれる額）', c.buyTax, c.buyTax);
    trow('差額（収支表の消費税）', c.A.tax, c.B.tax, true);
  }
  y += 16;
  const H = Math.ceil(y);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${SVG_FONT}" shape-rendering="crispEdges" text-rendering="geometricPrecision"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>${o.join('')}</svg>`;
  return {svg, W, H};
}

/* =========================================================
   画像（PNG）・コピー・保存・印刷
   ========================================================= */
const png = {key:null, blob:null, pendingKey:null, pending:null};
const IMG_SCALE = 2, IMG_PAD = 6;   // スマホ画面のスクリーンショットとほぼ同じ大きさ（2倍）、周りに細い白余白
function svgToPng(svg, W, H, scale = 2, pad = 0){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const draw = () => {
        try {
          const cv = document.createElement('canvas');
          cv.width = (W + pad * 2) * scale; cv.height = (H + pad * 2) * scale;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
          ctx.drawImage(img, pad * scale, pad * scale, W * scale, H * scale);
          cv.toBlob(b => b ? resolve(b) : reject(new Error('toBlob')), 'image/png');
        } catch(e){ reject(e); }
      };
      // Safari は読み込み直後だと文字が描かれないことがあるので一呼吸おく
      requestAnimationFrame(() => setTimeout(draw, 30));
    };
    img.onerror = () => reject(new Error('svg'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
function ensurePng(){
  const key = lastImg.svg;
  if (png.key === key && png.blob) return Promise.resolve(png.blob);
  if (png.pendingKey === key && png.pending) return png.pending;
  const {svg, W, H} = lastImg;
  png.pendingKey = key;
  png.pending = svgToPng(svg, W, H, IMG_SCALE, IMG_PAD).then(b => { if (png.pendingKey === key){ png.key = key; png.blob = b; } return b; });
  return png.pending;
}
const pngReady = () => png.key === lastImg.svg && png.blob;
function fileBase(){ const nm = (cur().v.name || '物件').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40); return `収支表_${nm}_${ymd()}`; }
function download(blob, name){
  const a = el('a', {href:URL.createObjectURL(blob), download:name});
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const isTouch = matchMedia('(pointer: coarse)').matches;
async function copyImage(){
  if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)){
    return saveImage('このブラウザは画像のコピーに対応していないため、画像を保存します');
  }
  try {
    // Safari はクリック直後に ClipboardItem を作る必要があるので、画像は Promise のまま渡す
    const item = new ClipboardItem({'image/png': pngReady() ? png.blob : ensurePng()});
    await navigator.clipboard.write([item]);
    toast('収支表を画像でコピーしました。LINEやメールに貼り付けできます');
  } catch(e1){
    try {
      const b = await ensurePng();
      await navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
      toast('収支表を画像でコピーしました。LINEやメールに貼り付けできます');
    } catch(e2){
      console.warn('copy failed', e1, e2);
      saveImage('この環境では画像のコピーができなかったため、画像を保存します');
    }
  }
}
async function saveImage(msg){
  const name = fileBase() + '.png';
  const share = blob => {
    const file = new File([blob], name, {type:'image/png'});
    if (isTouch && navigator.canShare && navigator.canShare({files:[file]})){
      return navigator.share({files:[file], title:name}).then(() => true, e => e && e.name === 'AbortError' ? true : false);
    }
    return Promise.resolve(false);
  };
  try {
    const blob = pngReady() ? png.blob : await ensurePng();
    if (await share(blob)) return;
    download(blob, name);
    toast(msg || '画像を保存しました');
  } catch(e){ console.warn(e); toast('画像を作れませんでした'); }
}

/* =========================================================
   モーダル・トースト
   ========================================================= */
let toastTimer = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }
function modal({title, body, buttons}){
  const bg = el('div', {class:'modal-bg'});
  const close = () => bg.remove();
  const mf = el('div', {class:'mf'});
  for (const b of buttons){
    mf.append(el('button', {class:'btn ' + (b.cls || ''), text:b.label, onclick:() => { if (b.onClick && b.onClick() === false) return; close(); }}));
  }
  bg.append(el('div', {class:'modal', role:'dialog', 'aria-modal':'true'}, el('h3', {text:title}), el('div', {class:'mb'}, body), mf));
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  document.addEventListener('keydown', function k(e){ if (e.key === 'Escape'){ close(); document.removeEventListener('keydown', k); } });
  document.body.append(bg);
  return close;
}

/* =========================================================
   物件の操作・書き出し・読み込み・設定
   ========================================================= */
function newProp(){
  const p = makeProp({});
  db.items[p.id] = p; db.order.push(p.id);
  switchTo(p.id); setTab('input');
  setTimeout(() => { const n = $('#f-name'); n && n.focus(); }, 50);
  markChanged();
  toast('新しい物件を作りました（初期値が入っています）');
}
function dupProp(){
  const src = cur(); const p = makeProp(clone(src.v));
  p.v.name = (src.v.name || '物件') + '（コピー）';
  db.items[p.id] = p; db.order.push(p.id); switchTo(p.id); markChanged(); toast('複製しました');
}
function delProp(){
  const p = cur();
  modal({ title:'この物件を削除しますか？', body:el('div', {text:`「${p.v.name || '（名称未設定）'}」を削除します。元に戻せません。`}),
    buttons:[{label:'キャンセル'}, {label:'削除する', cls:'danger', onClick:() => {
      delete db.items[p.id]; db.order = db.order.filter(id => id !== p.id);
      if (!db.order.length){ const np = makeProp({}); db.items[np.id] = np; db.order.push(np.id); }
      const next = db.order.slice().sort((a, b) => db.items[b].updatedAt - db.items[a].updatedAt)[0];
      switchTo(next); markChanged(); toast('削除しました');
    }}]});
}
function exportData(){
  const now = new Date();
  const data = { app:'kaitori-shushi', version:1, exportedAt:now.toISOString(), settings,
                 properties:db.order.map(id => db.items[id]) };
  const hm = String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
  download(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}), `収支表バックアップ_${ymd()}_${hm}.json`);
  meta.lastBackupAt = now.getTime(); meta.snoozeUntil = 0; saveMeta(); checkBackup();
  toast(`バックアップを保存しました（${db.order.length}件・ダウンロードフォルダ）`);
}
function importData(file){
  const fr = new FileReader();
  fr.onload = () => {
    let data;
    try { data = JSON.parse(fr.result); } catch(e){ toast('ファイルを読み込めませんでした'); return; }
    if (!data || data.app !== 'kaitori-shushi' || !Array.isArray(data.properties)){ toast('この収支表のデータファイルではありません'); return; }
    const props = data.properties.filter(p => p && p.id && p.v);
    const exported = Date.parse(data.exportedAt) || null;
    const add = replace => {
      const hadSettings = store.get(KEY_SET) != null;
      if (replace) db = {current:null, order:[], items:{}};
      else for (const id of db.order.slice()) if (db.items[id] && db.items[id].autoSample){ delete db.items[id]; db.order = db.order.filter(x => x !== id); }
      if (data.settings && (replace || !hadSettings)){ settings = mergeSettings(data.settings); store.set(KEY_SET, settings); }
      let restored = 0, kept = 0;
      for (const p of props){
        p.v = normalizeV(Object.assign(blankValues(), p.v));
        const ex = db.items[p.id];
        if (ex && (ex.updatedAt || 0) > (p.updatedAt || 0)){ kept++; continue; }
        if (!ex) db.order.push(p.id);
        db.items[p.id] = p; restored++;
      }
      if (!db.order.length){ const np = makeProp({}); db.items[np.id] = np; db.order.push(np.id); }
      if (exported){ meta.lastBackupAt = Math.max(meta.lastBackupAt || 0, exported); saveMeta(); }
      switchTo(props[0] && db.items[props[0].id] ? props[0].id : db.order[0]);
      checkBackup();
      toast(kept ? `${restored}件を戻しました（${kept}件はこのブラウザの方が新しいので、そのままにしました）` : `${restored}件の物件を戻しました`);
    };
    const w = exported ? new Date(exported) : null;
    const when = w ? `（${w.getFullYear()}/${w.getMonth() + 1}/${w.getDate()} ${w.getHours()}:${String(w.getMinutes()).padStart(2, '0')} に保存）` : '';
    modal({ title:'バックアップから戻す', body:el('div', {html:
      `このファイルには <b>${props.length}件</b> の物件が入っています${when}。<br>「戻す」を押すと、ファイルの物件をこのブラウザに戻します。今ある物件はそのまま残り、同じ物件はより新しい方が残ります。`}),
      buttons:[{label:'キャンセル'}, {label:'今のデータを消して置き換える', onClick:() => add(true)}, {label:'戻す', cls:'primary', onClick:() => add(false)}]});
  };
  fr.readAsText(file);
}
function openSettings(){
  const tmp = clone(settings);
  const body = el('div');
  const mk = (group, list) => {
    const grid = el('div', {class:'grid'});
    const ctx = { prefix:'s-' + group + '-', get:k => tmp[group][k], set:(k, val) => { tmp[group][k] = val; }, changed:() => {} };
    for (const f of list){ const o = makeField(f, ctx); o.load(); o.update({}, {}); grid.append(o.wrap); }
    return grid;
  };
  body.append(el('div', {class:'sub', html:'新規物件の初期値<small>これから作る物件に入ります</small>'}));
  body.append(mk('defaults', [
    {k:'months', label:'保有月数', type:'int', unit:'ヶ月'},
    {k:'regBuy', label:'取得時登記費用', type:'yen'},
    {k:'bkFlag', label:'仕入時仲介手数料', type:'select', options:['あり','なし']},
    {k:'rate', label:'年利', type:'pct'},
    {k:'loanFee', label:'融資手数料', type:'yen'},
    {k:'util', label:'電気・水道代', type:'yen', unit:'円/月'},
    {k:'inshi', label:'印紙、不動産取得税', type:'yen'},
    {k:'ad', label:'広告宣伝費', type:'yen'},
    {k:'hoken', label:'まもりすまい保険', type:'yen'},
    {k:'regSell', label:'売却時登記費用', type:'yen'},
    {k:'kyakuRate', label:'客付仲介手数料率', type:'pct'},
    {k:'incRate', label:'販売インセンティブ率', type:'pct'},
    {k:'sincRate', label:'仕入担当インセンティブ率', type:'pct'},
    {k:'roumu', label:'労務費・販売費', type:'yen', unit:'円/月'},
    {k:'taxRate', label:'消費税率', type:'pct'},
    {k:'tmpRate', label:'暫定税率（評価額未入力時）', type:'pct'},
  ]));
  body.append(el('div', {class:'sub', html:'計算ルール<small>すべての物件の計算に使われます</small>'}));
  body.append(mk('rules', [
    {k:'bkRate', label:'仕入時仲介手数料の率', type:'pct', note:'(仕入価格×率＋加算額)×(1＋消費税率)'},
    {k:'bkAdd', label:'仕入時仲介手数料の加算額', type:'yen'},
    {k:'loanRatio', label:'借入額（自動）の割合', type:'pct', note:'仕入価格×割合'},
    {k:'yobiRate', label:'予備費（自動）の割合', type:'pct', note:'融資手数料×割合'},
  ]));
  body.append(el('div', {class:'sub', text:'画面・印刷の収支表に入れる内容'}));
  body.append(mk('display', [
    {k:'taxDetail', label:'消費税の内訳を入れる（画像には入りません）', type:'check', span:2},
  ]));
  modal({ title:'初期値・計算ルールの設定', body, buttons:[
    {label:'最初の値に戻す', onClick:() => { settings = clone(DEFAULT_SETTINGS); store.set(KEY_SET, settings); render(); toast('設定を最初の値に戻しました'); }},
    {label:'キャンセル'},
    {label:'保存', cls:'primary', onClick:() => {
      for (const g of ['defaults','rules']) for (const k of Object.keys(tmp[g])) if (tmp[g][k] == null && g === 'rules') tmp[g][k] = DEFAULT_SETTINGS[g][k];
      settings = tmp; store.set(KEY_SET, settings); render(); markChanged(); toast('設定を保存しました');
    }}]});
}

}
function syncTopbarHeight(){ document.documentElement.style.setProperty('--topbar-h', $('#topbar').offsetHeight + 'px'); }

   起動

calcFontK();
buildInputs();
renderSelect();
loadInputs();
render();
persist();
syncTopbarHeight();
window.addEventListener('resize', syncTopbarHeight);
checkBackup();
setInterval(checkBackup, 60 * 60 * 1000);
if (pcMQ.addEventListener) pcMQ.addEventListener('change', render); else pcMQ.addListener(render);

const menu = $('#menu');
$('#btnMenu').addEventListener('click', e => { e.stopPropagation(); const open = menu.classList.toggle('open'); $('#btnMenu').setAttribute('aria-expanded', open); });
document.addEventListener('click', () => { menu.classList.remove('open'); $('#btnMenu').setAttribute('aria-expanded', 'false'); });
menu.querySelector('.menu-pop').addEventListener('click', e => {

// 動作確認用
window.shushi = { compute:v => compute(v, settings.rules), current:() => cur(), calc:() => lastCalc, imageSVG:() => lastImg.svg, fontK:() => fontK };
})();
